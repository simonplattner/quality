name: release

# Pushing tag vN publishes ghcr.io/simonplattner/quality:vN, the image lint.yaml at that tag runs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/simonplattner/quality:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: lint.yaml runs the image being released
        run: grep -qwF "$IMAGE" .github/workflows/lint.yaml
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Release tags are immutable
        run: |
          if out=$(docker manifest inspect "$IMAGE" 2>&1); then
            echo "$IMAGE already exists"
            exit 1
          fi
          # Only an explicit "unknown" proves absence; any other error (denied, network) must not pass.
          grep -qE 'manifest unknown|name unknown' <<<"$out" || {
            echo "$out"
            exit 1
          }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          tags: quality
          load: true
          cache-from: type=gha
      - run: docker run --rm -v "$PWD/tests:/tests:ro" quality /tests/run
      - run: docker tag quality "$IMAGE"
      - run: docker push "$IMAGE"
